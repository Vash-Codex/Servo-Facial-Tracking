# Build & Release – Face Tracker Control Center
#
# Triggers on any tag matching v*.*.* (e.g. v1.0.0, v2.1.3-beta)
# Builds a Windows executable with PyInstaller and publishes it as a
# GitHub Release with the zipped dist folder attached as an asset.

name: Build & Release

on:
  push:
    tags:
      - "v*.*.*"   # e.g. v1.0.0, v1.2.3-beta

  # Allow triggering manually from the Actions tab (useful for testing)
  workflow_dispatch:

permissions:
  contents: write  # required to create releases and upload assets

jobs:
  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Python ────────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── 3. Cache pip ─────────────────────────────────────────────────────
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # ── 4. Install dependencies ──────────────────────────────────────────
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller>=6.0
          pip install -r requirements.txt

      # ── 5. Create placeholder folders not tracked by git ────────────────
      - name: Create runtime placeholder folders
        shell: pwsh
        run: |
          # dataset/ is gitignored (user-captured images). Create an empty
          # folder so the built app starts without errors on first launch.
          New-Item -ItemType Directory -Force -Path "dataset" | Out-Null

      # ── 6. Build with PyInstaller ────────────────────────────────────────
      - name: Build executable
        run: pyinstaller face_tracker_gui.spec

      # ── 7. Add runtime folders to dist ──────────────────────────────────
      - name: Add runtime placeholder folders to dist
        shell: pwsh
        run: |
          # dataset/ is not bundled by PyInstaller (gitignored).
          # Copy the empty placeholder into dist so users get the right layout.
          Copy-Item -Recurse -Force -Path "dataset" -Destination "dist\FaceTrackerGUI\dataset"

      # ── 8. Zip the output folder ─────────────────────────────────────────
      - name: Zip release artifact
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $zipName = "FaceTracker-Windows-${tag}.zip"
          Compress-Archive -Path dist\FaceTrackerGUI\* -DestinationPath $zipName
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      # ── 9. Create GitHub Release and upload asset ────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Face Tracker ${{ github.ref_name }}"
          body: |
            ## Face Tracker Control Center ${{ github.ref_name }}

            ### Installation
            1. Download `FaceTracker-Windows-${{ github.ref_name }}.zip` below.
            2. Extract the zip to any folder.
            3. Run **FaceTrackerGUI.exe**.

            ### Requirements
            - Windows 10/11 (64-bit)
            - A USB webcam
            - *(Optional)* Arduino with servo connected via USB

            ### What's included
            - `FaceTrackerGUI.exe` – the main launcher
            - `face.py` – basic tracker (launched from the GUI)
            - `custom face/` – LBPH trainer & tracker scripts
            - `dataset/` – face image dataset folder
            - `facearduino/` – Arduino sketch

            ---
            *Built automatically from commit `${{ github.sha }}`*
          generate_release_notes: true
          files: ${{ env.ZIP_NAME }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
