# Build & Release – Face Tracker Control Center
#
# Triggers on any tag matching v*.*.* (e.g. v1.0.0, v2.1.3-beta)
# Builds a SINGLE Windows executable with PyInstaller (onefile mode) and
# publishes it as a GitHub Release with the EXE attached as an asset.
#
# Users only need to download ONE file: FaceTrackerGUI.exe

name: Build & Release

on:
  push:
    tags:
      - "v*"

  # Allow triggering manually from the Actions tab (useful for testing)
  workflow_dispatch:

permissions:
  contents: write  # required to create releases and upload assets

jobs:
  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Python ────────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── 3. Cache pip ─────────────────────────────────────────────────────
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # ── 4. Install dependencies ──────────────────────────────────────────
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller>=6.0
          pip install -r requirements.txt

      # ── 5. Create placeholder folders not tracked by git ────────────────
      - name: Create runtime placeholder folders
        shell: pwsh
        run: |
          # dataset/ is gitignored (user-captured images). Create an empty
          # folder so PyInstaller can reference it without errors.
          New-Item -ItemType Directory -Force -Path "dataset" | Out-Null

      # ── 6. Build with PyInstaller ────────────────────────────────────────
      - name: Build executable
        run: pyinstaller face_tracker_gui.spec

      # ── 7. Prepare release asset ─────────────────────────────────────────
      # Onefile mode produces a single dist/FaceTrackerGUI.exe.
      # We ship the EXE directly — no zip needed, no extra files required.
      - name: Verify output
        shell: pwsh
        run: |
          $exePath = "dist\FaceTrackerGUI.exe"
          if (-not (Test-Path $exePath)) {
            Write-Error "Build output not found: $exePath"
            exit 1
          }
          $size = (Get-Item $exePath).Length / 1MB
          Write-Host "✓ FaceTrackerGUI.exe built successfully ($([math]::Round($size,1)) MB)"

      # ── 8. Create GitHub Release and upload the single EXE ───────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Face Tracker ${{ github.ref_name }}"
          body: |
            ## Face Tracker Control Center ${{ github.ref_name }}

            ### Installation
            1. Download `FaceTrackerGUI.exe` below.
            2. Double-click to run — **no installation, no extra files needed**.
            3. On first run Windows may show a SmartScreen warning; click *More info → Run anyway*.

            ### Usage
            - **Train Face Model** — captures face samples and trains the LBPH model
            - **Run LBPH Tracker** — recognition + servo tracking using your trained model
            - **Run Basic Tracker** — quick Haar-cascade-only camera test
            - All tracker output appears in the GUI log panel

            ### Requirements
            - Windows 10/11 (64-bit)
            - A USB webcam
            - *(Optional)* Arduino with servo connected via USB

            ### First-run notes
            - `dataset/` and `custom face/` folders are created automatically next to the EXE when you first train
            - The bundled face model works out-of-the-box; train your own for personalised recognition

            ---
            *Built automatically from commit `${{ github.sha }}`*
          generate_release_notes: true
          files: dist/FaceTrackerGUI.exe
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
